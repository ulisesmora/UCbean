<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Around the Bean — Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #fdf2f4;
    --bg-2: #fad9e2;
    --bg-3: #f5c0d0;
    --surface: rgba(255, 252, 253, 0.72);
    --surface-strong: rgba(255, 252, 253, 0.92);
    --surface-deep: #241820;
    --ink: #241820;
    --ink-soft: #4a3340;
    --ink-mute: #8a7080;
    --line: rgba(36, 24, 32, 0.08);
    --line-strong: rgba(36, 24, 32, 0.18);
    --accent: #e89bb0;
    --accent-deep: #b95979;
    --accent-soft: #fde3ea;
    --gold: #b8893a;
    --shadow-sm: 0 1px 2px rgba(28,24,20,0.06), 0 2px 8px rgba(28,24,20,0.04);
    --shadow-md: 0 4px 12px rgba(28,24,20,0.08), 0 12px 32px rgba(28,24,20,0.06);
    --shadow-lg: 0 12px 40px rgba(28,24,20,0.18), 0 24px 64px rgba(28,24,20,0.10);
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-xl: 28px;
    --maxw: 1240px;
    --font-body: 'Plus Jakarta Sans';
    --font-display: 'Plus Jakarta Sans';
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-body), -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1400px 700px at 15% -5%, #fde3ea 0%, transparent 55%),
      radial-gradient(1200px 600px at 95% 15%, #fad9e2 0%, transparent 50%),
      linear-gradient(180deg, #fff5f7 0%, #fdf2f4 40%, #fbe7ed 100%);
    background-attachment: fixed;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent-soft); }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="desktop.jsx"></script>

<div id="theme-switcher"></div>
<script type="text/babel" src="theme-switcher.jsx"></script>

</body>
</html>
