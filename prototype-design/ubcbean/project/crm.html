<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Around the Bean — Owner CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: rgba(255, 252, 253, 0.72);
    --surface-strong: #ffffff;
    --surface-deep: #241820;
    --ink: #241820;
    --ink-soft: #4a3340;
    --ink-mute: #8a7080;
    --line: rgba(36, 24, 32, 0.09);
    --line-strong: rgba(36, 24, 32, 0.16);
    --accent: #e89bb0;
    --accent-deep: #b95979;
    --accent-soft: #fde3ea;
    --gold: #b8893a;
    --shadow-sm: 0 1px 2px rgba(28,24,20,0.05), 0 2px 8px rgba(28,24,20,0.04);
    --shadow-md: 0 4px 12px rgba(28,24,20,0.07), 0 12px 32px rgba(28,24,20,0.05);
    --shadow-lg: 0 12px 40px rgba(28,24,20,0.16), 0 24px 64px rgba(28,24,20,0.10);
    --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px;
    --font-body: 'Plus Jakarta Sans';
    --font-display: 'Plus Jakarta Sans';
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-body), -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background: #f7f1f3;
  }
  ::selection { background: var(--accent-soft); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(36,24,32,0.16); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  @keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(-8px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(185,89,121,0.4); } 50% { box-shadow:0 0 0 6px rgba(185,89,121,0); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="crm-views.jsx"></script>
<script type="text/babel" src="crm.jsx"></script>

<div id="theme-switcher"></div>
<script type="text/babel" src="theme-switcher.jsx"></script>

</body>
</html>
